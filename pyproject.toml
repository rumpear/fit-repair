[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fit-repair"
version = "0.1.0"
description = "Remove GPS spoofing/jamming artefacts from bike computer FIT files and merge split recordings"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["fitdecode>=0.10"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
fit-clean = "fit_repair.cli:main"
fit-merge = "fit_repair.merge_cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
